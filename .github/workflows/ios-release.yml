name: iOS Build for Sideload

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA (Sideload)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        echo "=== Available Xcode versions ==="
        ls /Applications/ | grep -i xcode || true
        echo ""
        echo "=== Current Xcode ==="
        xcode-select --print-path
        xcodebuild -version
        echo ""
        # Select the latest Xcode available
        LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "$LATEST" ]; then
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"
          echo "=== Now using ==="
          xcodebuild -version
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore MotoGPS/MotoGPS.csproj

    - name: Build iOS (arm64, no signing)
      run: |
        dotnet publish MotoGPS/MotoGPS.csproj \
          -f net9.0-ios \
          -c Release \
          -r ios-arm64 \
          -o ./build/ios \
          /p:ArchiveOnBuild=false \
          /p:EnableCodeSigning=false \
          /p:CodesignKey="" \
          /p:CodesignProvision=""

    - name: Package as IPA
      run: |
        APP=$(find ./build/ios -name "*.app" | head -1)
        mkdir -p Payload
        cp -r "$APP" Payload/
        zip -r MotoGPS.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: MotoGPS-iOS-Sideload
        path: MotoGPS.ipa
        retention-days: 30
