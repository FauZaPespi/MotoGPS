name: iOS Build for Sideload

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA (Sideload)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 26.3
      run: |
        sudo xcode-select -s /Applications/Xcode_26.3.app
        xcodebuild -version

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI workload (pinned to Xcode 26.3)
      run: dotnet workload install maui --from-rollback-file workload-rollback.json

    - name: Restore dependencies
      run: dotnet restore MotoGPS/MotoGPS.csproj

    - name: Build iOS (arm64, no signing)
      run: |
        dotnet publish MotoGPS/MotoGPS.csproj \
          -f net9.0-ios \
          -c Release \
          -r ios-arm64 \
          -o ./build/ios \
          /p:ArchiveOnBuild=false \
          /p:EnableCodeSigning=false \
          /p:CodesignKey="" \
          /p:CodesignProvision=""

    - name: Package .app as unsigned .ipa
      run: |
        APP_DIR=$(find ./build/ios -type d -name "*.app" | head -n 1)
        if [ -z "$APP_DIR" ]; then
          echo "::error::No .app bundle found under ./build/ios"
          find ./build/ios -maxdepth 3 -type d
          exit 1
        fi
        echo "Found .app at $APP_DIR"
        mkdir -p ./build/ipa/Payload
        cp -R "$APP_DIR" ./build/ipa/Payload/
        (cd ./build/ipa && zip -qr MotoGPS.ipa Payload)
        ls -lh ./build/ipa/MotoGPS.ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: MotoGPS-iOS-Sideload
        path: ./build/ipa/MotoGPS.ipa
        retention-days: 30
