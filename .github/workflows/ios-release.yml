name: iOS Build for Sideload

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore MotoGPS/MotoGPS.csproj

    - name: Build iOS (Device - Ad-hoc signing)
      run: |
        dotnet publish MotoGPS/MotoGPS.csproj \
          -f net9.0-ios \
          -c Release \
          -r ios-arm64 \
          -o ./artifacts/ios \
          /p:ArchiveOnBuild=true \
          /p:CodesignKey="-" \
          /p:CodesignProvision=""

    - name: Upload iOS IPA
      uses: actions/upload-artifact@v4
      with:
        name: MotoGPS-iOS
        path: ./artifacts/ios/**/*.ipa
        retention-days: 30
