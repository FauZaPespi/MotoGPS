name: Build All Platforms

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore MotoGPS/MotoGPS.csproj

    - name: Build Windows
      run: |
        dotnet publish MotoGPS/MotoGPS.csproj \
          -f net9.0-windows10.0.19041.0 \
          -c Release \
          -o ./artifacts/windows

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: MotoGPS-Windows
        path: ./artifacts/windows/**/*.*
        retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Restore dependencies
      run: dotnet restore MotoGPS/MotoGPS.csproj

    - name: Build Android
      run: |
        dotnet publish MotoGPS/MotoGPS.csproj \
          -f net9.0-android \
          -c Release \
          -o ./artifacts/android

    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: MotoGPS-Android
        path: ./artifacts/android/**/*.apk
        retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 26.3
      run: |
        sudo xcode-select -s /Applications/Xcode_26.3.app
        xcodebuild -version

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI workload (pinned to Xcode 26.3)
      run: dotnet workload install maui --from-rollback-file workload-rollback.json

    - name: Restore dependencies
      run: dotnet restore MotoGPS/MotoGPS.csproj

    - name: Build iOS (compile check, no signing)
      run: |
        dotnet build MotoGPS/MotoGPS.csproj \
          -f net9.0-ios \
          -c Release \
          -r ios-arm64 \
          /p:EnableCodeSigning=false \
          /p:CodesignKey="" \
          /p:CodesignProvision=""
